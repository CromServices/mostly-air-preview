<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Mostly Air</title>
  <meta name="description" content="Split and ducted installs, sales, repairs and maintenance in the Adelaide Hills. Call Andrew Moseley on 0411 135 918.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/site.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("mostly-air-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "light");
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="logo" href="index.html"><img src="assets/logo.svg" width="207" height="44" alt="Mostly Air"></a>
      <nav class="primary" aria-label="Site">
        <a href="work.html">Work</a>
        <a href="about.html">About</a>
        <a href="quote.html">Quote</a>
        <a href="quote.html#book">Book</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">Dark</button>
        <a class="btn btn-cyan" href="quote.html">Request a quote</a>
      </div>
    </div>
  </header>
  <main id="main" class="page">
    <div class="wrap">
      <h1>Page not found</h1>
      <p class="lead"><a href="index.html">Back to Mostly Air</a></p>
    </div>
  </main>
  <script src="js/site.js" defer></script>
</body>
</html>
